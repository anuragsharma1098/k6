name: Performance Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  performance-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup k6
      run: |
        sudo apt update
        sudo apt install -y wget
        wget -q -O - https://dl.k6.io/key.gpg | sudo apt-key add -
        echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt update
        sudo apt install -y k6

    - name: Run smoke tests
      run: k6 run --out html=results/smoke_test_results.html tests/smoke/smoke_test.js
      continue-on-error: true

    # - name: Run load tests
    #   run: k6 run --out html=results/load_test_results.html tests/load/load_test.js
    #   continue-on-error: true

    # - name: Run stress tests
    #   run: k6 run --out html=results/stress_test_results.html tests/stress/stress_test.js
    #   continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: k6-test-results
        path: results/
        retention-days: 30

    - name: Comment PR with HTML report
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          const resultsDir = 'results';
          const htmlFiles = fs.readdirSync(resultsDir).filter(f => f.endsWith('.html')).sort();

          let comment = '## Performance Test Report\n\n';
          
          if (htmlFiles.length === 0) {
            comment += 'No HTML reports generated.';
          } else {
            comment += 'Test reports have been generated. Click below to download:\n\n';
            htmlFiles.forEach(file => {
              const testName = file.replace('_test_results.html', '').replace(/_/g, ' ').toUpperCase();
              comment += `- **${testName}**: [${file}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            });
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });