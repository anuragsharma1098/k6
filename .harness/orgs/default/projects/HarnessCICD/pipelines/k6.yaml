pipeline:
  name: k6
  identifier: k6
  projectIdentifier: HarnessCICD
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: account.github
        repoName: k6
        build: <+input>
  stages:
    - stage:
        name: Performance Tests
        identifier: Performance_Tests
        description: Run k6 performance tests
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Docker
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Create Results Directory
                  identifier: Create_Results_Directory
                  spec:
                    shell: Sh
                    command: |
                      mkdir -p results
                      chmod 777 results
              - step:
                  type: Run
                  name: Run Smoke Test
                  identifier: Run_Smoke_Test
                  spec:
                    image: grafana/k6:latest
                    shell: Sh
                    command: |
                      k6 run \
                      --out json=results/smoke_test_results.json \
                      tests/smoke/smoke_test.js
              - step:
                  type: Run
                  name: Verify Test Results
                  identifier: Verify_Test_Results
                  spec:
                    shell: Sh
                    command: |
                      echo "Performance Test Results:"
                      ls -lh results/
