name: Performance Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  performance-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup k6
      run: |
        sudo apt update
        sudo apt install -y wget
        wget -q -O - https://dl.k6.io/key.gpg | sudo apt-key add -
        echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt update
        sudo apt install -y k6

    - name: Run smoke tests
      run: k6 run --out json=results/smoke_test_results.json tests/smoke/smoke_test.js

    # - name: Run load tests
    #   run: k6 run --out json=results/load_test_results.json tests/load/load_test.js

    # - name: Run stress tests
    #   run: k6 run --out json=results/stress_test_results.json tests/stress/stress_test.js

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: k6-test-results
        path: results/
        retention-days: 30
